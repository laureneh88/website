<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="photoFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8DFD0"/>
      <stop offset="100%" stop-color="#DDD3C2"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B9B6A"/>
      <stop offset="40%" stop-color="#7A8B5C"/>
      <stop offset="100%" stop-color="#6B7A4E"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C49468"/>
      <stop offset="100%" stop-color="#A87850"/>
    </linearGradient>
    <filter id="photoshadow">
      <feDropShadow dx="4" dy="6" stdDeviation="12" flood-color="#0A0908" flood-opacity="0.4"/>
    </filter>
    <filter id="calloutglow">
      <feDropShadow dx="1" dy="2" stdDeviation="4" flood-color="#0A0908" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  
  
  <!-- Photo frame - slightly tilted like a snapshot -->
  <g transform="rotate(-3, 280, 240)" filter="url(#photoshadow)">
    <!-- Polaroid-style frame -->
    <rect x="155" y="75" width="250" height="300" rx="6" fill="url(#photoFrame)"/>
    
    <!-- Photo area inside frame -->
    <rect x="170" y="90" width="220" height="220" rx="3" fill="#2A2A22"/>
    
    <!-- Simple plant in pot -->
    <!-- Pot -->
    <path d="M 255 285 L 245 260 L 305 260 L 295 285 Z" fill="url(#pot)" opacity="0.9"/>
    <rect x="240" y="253" width="70" height="10" rx="2" fill="#C49468"/>
    
    <!-- Stem -->
    <line x1="275" y1="253" x2="275" y2="190" stroke="#6B7A4E" stroke-width="3" opacity="0.8"/>
    <line x1="275" y1="220" x2="250" y2="195" stroke="#6B7A4E" stroke-width="2.5" opacity="0.7"/>
    <line x1="275" y1="210" x2="305" y2="185" stroke="#6B7A4E" stroke-width="2.5" opacity="0.7"/>
    
    <!-- Healthy leaves -->
    <ellipse cx="270" cy="185" rx="22" ry="10" transform="rotate(-30, 270, 185)" fill="#8B9B6A" opacity="0.8"/>
    <ellipse cx="300" cy="178" rx="20" ry="9" transform="rotate(25, 300, 178)" fill="#7A8B5C" opacity="0.8"/>
    
    <!-- Drooping/yellowing leaf - the problem -->
    <ellipse cx="248" cy="200" rx="20" ry="9" transform="rotate(-50, 248, 200)" fill="#C4A848" opacity="0.7"/>
    
    <!-- Another slightly yellow leaf -->
    <ellipse cx="275" cy="170" rx="18" ry="8" transform="rotate(5, 275, 170)" fill="#A8B068" opacity="0.7"/>
    
    <!-- Brown spots on leaves -->
    <circle cx="252" cy="197" r="2.5" fill="#8B6A3A" opacity="0.5"/>
    <circle cx="244" cy="203" r="1.8" fill="#8B6A3A" opacity="0.4"/>
    <circle cx="278" cy="168" r="2" fill="#8B6A3A" opacity="0.4"/>
  </g>
  
  <!-- Annotation callout - floating over the photo -->
  <g filter="url(#calloutglow)">
    <!-- Callout circle pointing to the yellow leaf -->
    <circle cx="225" cy="195" r="28" fill="none" stroke="#E8B86D" stroke-width="1.8" opacity="0.7" stroke-dasharray="4,3"/>
    
    <!-- Callout bubble -->
    <rect x="330" y="140" width="150" height="55" rx="10" fill="#2A2520" opacity="0.92"/>
    <line x1="330" y1="165" x2="253" y2="195" stroke="#E8B86D" stroke-width="1" opacity="0.4"/>
    
    <!-- Callout text -->
    <text x="345" y="161" fill="#E8DFD0" font-family="Georgia, 'Times New Roman', serif" font-size="11" opacity="0.9">Leaf spot disease.</text>
    <text x="345" y="180" fill="#C4B8A4" font-family="Georgia, 'Times New Roman', serif" font-size="10" opacity="0.6">Reduce watering, trim</text>
    <text x="345" y="193" fill="#C4B8A4" font-family="Georgia, 'Times New Roman', serif" font-size="10" opacity="0.6">affected leaves.</text>
  </g>
</svg>
