<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cardA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8DFD0"/>
      <stop offset="100%" stop-color="#DDD3C2"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8DDD4"/>
      <stop offset="100%" stop-color="#C8D0C4"/>
    </linearGradient>
    <filter id="cardshadow">
      <feDropShadow dx="3" dy="5" stdDeviation="10" flood-color="#0A0908" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background -->
  
  
  <!-- Option A card -->
  <g transform="rotate(-4, 230, 240)" filter="url(#cardshadow)">
    <rect x="130" y="110" width="190" height="250" rx="8" fill="url(#cardA)"/>
    
    <!-- Label -->
    <text x="155" y="148" fill="#6B5D4E" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="1.5" opacity="0.6">OPTION A</text>
    
    <!-- Title text -->
    <text x="155" y="185" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold">Less</text>
    <text x="155" y="215" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold">cost.</text>
    
    <!-- Subtle detail lines -->
    <rect x="155" y="245" width="100" height="3" rx="1" fill="#B8A898" opacity="0.3"/>
    <rect x="155" y="258" width="80" height="3" rx="1" fill="#B8A898" opacity="0.25"/>
    <rect x="155" y="271" width="110" height="3" rx="1" fill="#B8A898" opacity="0.2"/>
    
    <!-- Check marks suggesting pros -->
    <circle cx="163" cy="300" r="5" fill="#8B9B7A" opacity="0.5"/>
    <circle cx="163" cy="318" r="5" fill="#8B9B7A" opacity="0.4"/>
  </g>
  
  <!-- Option B card - overlapping -->
  <g transform="rotate(3, 370, 240)" filter="url(#cardshadow)">
    <rect x="280" y="115" width="190" height="250" rx="8" fill="url(#cardB)"/>
    
    <!-- Label -->
    <text x="305" y="153" fill="#4E5B4A" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="1.5" opacity="0.6">OPTION B</text>
    
    <!-- Title text -->
    <text x="305" y="190" fill="#2D3828" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold">Less</text>
    <text x="305" y="220" fill="#2D3828" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold">hassle.</text>
    
    <!-- Subtle detail lines -->
    <rect x="305" y="250" width="110" height="3" rx="1" fill="#8B9B7A" opacity="0.3"/>
    <rect x="305" y="263" width="90" height="3" rx="1" fill="#8B9B7A" opacity="0.25"/>
    <rect x="305" y="276" width="100" height="3" rx="1" fill="#8B9B7A" opacity="0.2"/>
    
    <!-- Check marks -->
    <circle cx="313" cy="305" r="5" fill="#D4944A" opacity="0.5"/>
    <circle cx="313" cy="323" r="5" fill="#D4944A" opacity="0.4"/>
    <circle cx="313" cy="341" r="5" fill="#D4944A" opacity="0.3"/>
  </g>
  
  <!-- Subtle connecting element between cards -->
  <line x1="290" y1="200" x2="310" y2="200" stroke="#C4B8A4" stroke-width="0.8" opacity="0.2"/>
</svg>
