<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="browser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2520"/>
      <stop offset="100%" stop-color="#232018"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2EBE0"/>
      <stop offset="100%" stop-color="#E8DFD0"/>
    </linearGradient>
    <filter id="browsershadow">
      <feDropShadow dx="4" dy="8" stdDeviation="15" flood-color="#0A0908" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="heroimg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C49468"/>
      <stop offset="50%" stop-color="#A8B89C"/>
      <stop offset="100%" stop-color="#8B9B7A"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  
  
  <!-- Browser window -->
  <g filter="url(#browsershadow)">
    <!-- Browser chrome -->
    <rect x="110" y="80" width="380" height="340" rx="10" fill="url(#browser)"/>
    
    <!-- Title bar dots -->
    <circle cx="135" cy="100" r="4.5" fill="#5B4A3A" opacity="0.6"/>
    <circle cx="150" cy="100" r="4.5" fill="#5B4A3A" opacity="0.6"/>
    <circle cx="165" cy="100" r="4.5" fill="#5B4A3A" opacity="0.6"/>
    
    <!-- URL bar -->
    <rect x="195" y="92" width="200" height="18" rx="5" fill="#1A1714" opacity="0.5"/>
    <text x="220" y="105" fill="#6B5D4E" font-family="'SF Mono', monospace" font-size="8" opacity="0.6">mysite.com</text>
    
    <!-- Page content area -->
    <rect x="125" y="118" width="350" height="290" rx="2" fill="url(#page)"/>
    
    <!-- Site header -->
    <text x="150" y="152" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" opacity="0.5">The Sunday Table</text>
    
    <!-- Hero text -->
    <text x="150" y="190" fill="#2A2218" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold">Cooked slowly,</text>
    <text x="150" y="218" fill="#2A2218" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold">written down</text>
    <text x="150" y="246" fill="#2A2218" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold">simply.</text>
    
    <!-- Hero image placeholder -->
    <rect x="355" y="150" width="100" height="105" rx="6" fill="url(#heroimg)" opacity="0.7"/>
    
    <!-- Recipe number badge -->
    <circle cx="440" cy="235" r="14" fill="#D4944A" opacity="0.7"/>
    <text x="440" y="240" text-anchor="middle" fill="#F2EBE0" font-family="Georgia, serif" font-size="14" font-weight="bold">2</text>
    
    <!-- Subtitle -->
    <text x="150" y="285" fill="#6B5D4E" font-family="Georgia, 'Times New Roman', serif" font-size="9" opacity="0.6">A personal blog about slow mornings</text>
    <text x="150" y="297" fill="#6B5D4E" font-family="Georgia, 'Times New Roman', serif" font-size="9" opacity="0.6">and small routines.</text>
    
    <!-- Recipes section -->
    <text x="150" y="330" fill="#3D3428" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" opacity="0.6">Recipes</text>
    
    <!-- Recipe cards -->
    <rect x="150" y="340" width="100" height="50" rx="4" fill="#E0D8CC"/>
    <rect x="265" y="340" width="100" height="50" rx="4" fill="#E0D8CC"/>
    <rect x="380" y="340" width="80" height="50" rx="4" fill="#E0D8CC"/>
    
    <rect x="158" y="348" width="60" height="3" rx="1" fill="#8B7D6B" opacity="0.4"/>
    <rect x="158" y="358" width="80" height="2.5" rx="1" fill="#A89880" opacity="0.25"/>
    <rect x="158" y="366" width="70" height="2.5" rx="1" fill="#A89880" opacity="0.25"/>
    
    <rect x="273" y="348" width="55" height="3" rx="1" fill="#8B7D6B" opacity="0.4"/>
    <rect x="273" y="358" width="75" height="2.5" rx="1" fill="#A89880" opacity="0.25"/>
    <rect x="273" y="366" width="65" height="2.5" rx="1" fill="#A89880" opacity="0.25"/>
  </g>
</svg>
