<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="paper1" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#F2EBE0"/>
      <stop offset="100%" stop-color="#E8DFD0"/>
    </linearGradient>
    <linearGradient id="paper2" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#EDE5D8"/>
      <stop offset="100%" stop-color="#DDD3C2"/>
    </linearGradient>
    <filter id="papershadow">
      <feDropShadow dx="4" dy="6" stdDeviation="12" flood-color="#0A0908" flood-opacity="0.35"/>
    </filter>
    <filter id="lightshadow">
      <feDropShadow dx="2" dy="3" stdDeviation="6" flood-color="#0A0908" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  
  
  <!-- Back paper - messy notes feel -->
  <g transform="rotate(-6, 270, 230)" filter="url(#papershadow)">
    <rect x="180" y="100" width="200" height="260" rx="3" fill="url(#paper2)"/>
    <!-- Scribbled lines suggesting rough notes -->
    <line x1="200" y1="140" x2="340" y2="140" stroke="#B8A898" stroke-width="1.2" opacity="0.5"/>
    <line x1="200" y1="160" x2="310" y2="160" stroke="#B8A898" stroke-width="1.2" opacity="0.4"/>
    <line x1="200" y1="180" x2="350" y2="180" stroke="#B8A898" stroke-width="1.2" opacity="0.5"/>
    <line x1="200" y1="200" x2="290" y2="200" stroke="#B8A898" stroke-width="1.2" opacity="0.3"/>
    <line x1="200" y1="220" x2="330" y2="220" stroke="#B8A898" stroke-width="1.2" opacity="0.4"/>
    <line x1="200" y1="240" x2="280" y2="240" stroke="#B8A898" stroke-width="1.2" opacity="0.3"/>
    <!-- Scratch/cross out -->
    <line x1="195" y1="175" x2="355" y2="185" stroke="#C4A882" stroke-width="0.8" opacity="0.3"/>
  </g>
  
  <!-- Front paper - clean document -->
  <g transform="rotate(3, 340, 240)" filter="url(#papershadow)">
    <rect x="240" y="110" width="200" height="260" rx="3" fill="url(#paper1)"/>
    
    <!-- Clean title block -->
    <rect x="265" y="145" width="90" height="8" rx="2" fill="#8B7D6B" opacity="0.7"/>
    
    <!-- Subtitle -->
    <rect x="265" y="163" width="60" height="5" rx="1.5" fill="#B8A898" opacity="0.4"/>
    
    <!-- Body text lines - clean and organized -->
    <rect x="265" y="190" width="150" height="3.5" rx="1" fill="#A89880" opacity="0.35"/>
    <rect x="265" y="202" width="145" height="3.5" rx="1" fill="#A89880" opacity="0.35"/>
    <rect x="265" y="214" width="130" height="3.5" rx="1" fill="#A89880" opacity="0.35"/>
    <rect x="265" y="226" width="150" height="3.5" rx="1" fill="#A89880" opacity="0.35"/>
    <rect x="265" y="238" width="100" height="3.5" rx="1" fill="#A89880" opacity="0.35"/>
    
    <!-- Section break -->
    <rect x="265" y="260" width="70" height="6" rx="2" fill="#8B7D6B" opacity="0.5"/>
    
    <rect x="265" y="278" width="150" height="3.5" rx="1" fill="#A89880" opacity="0.35"/>
    <rect x="265" y="290" width="140" height="3.5" rx="1" fill="#A89880" opacity="0.35"/>
    <rect x="265" y="302" width="120" height="3.5" rx="1" fill="#A89880" opacity="0.35"/>
    
    <!-- Small DOCX badge -->
    <rect x="370" y="335" width="48" height="18" rx="4" fill="#2A2520"/>
    <text x="394" y="348" text-anchor="middle" fill="#C4B8A4" font-family="'SF Mono', 'Menlo', monospace" font-size="9" letter-spacing="0.5">DOCX</text>
  </g>
  
  <!-- Arrow suggesting transformation -->
  <path d="M 225 320 Q 260 350 295 325" fill="none" stroke="#D4944A" stroke-width="1.5" opacity="0.5" stroke-dasharray="4,4"/>
</svg>
