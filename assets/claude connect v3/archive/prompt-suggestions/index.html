function render(){q('.pc-category-title').textContent=category;q('.pc-rows').replaceChildren();labels().forEach((t,i)=>{const b=document.createElement('button');b.className='pc-row';const s=document.createElement('span');s.className='pc-copy';s.textContent=t;const a=document.createElement('span');a.className='pc-arrow';a.textContent='›';b.append(s,a);b.onclick=()=>fill(i);q('.pc-rows').append(b)});qa('[data-version]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.version===version));qa('[data-category]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.category===category));q('.pc-state').textContent=!groups[category].old?'Proposed Write examples · original Write suggestions were not captured':version==='current'?'Current labels from your screenshots · baseline prompt handoff is illustrative':'Proposed wording and starter prompts';q('.pc-play').textContent=version==='proposed'?'↻ Replay replacement':'▶ Replace copy'}
function lock(on){busy=on;qa('.pc-controls button,.pc-categories button,.pc-row').forEach(b=>b.disabled=on)}
const wait=t=>new Promise(r=>setTimeout(r,t));
async function animate(){if(busy)return;if(!groups[category].old){version='proposed';render();toast('Write has proposed examples only.');return}const ticket=++run;version='current';render();q('.pc-list').hidden=false;lock(true);q('.pc-state').textContent='Replacing abstract suggestions with concrete starting points…';const nodes=qa('.pc-copy'),before=labels(),after=groups[category].items.map(x=>x[0]);if(!reduced){await wait(500);for(let k=1;k<=24;k++){if(ticket!==run)return;nodes.forEach((n,i)=>{n.parentElement.classList.add('typing');n.textContent=before[i].slice(0,Math.ceil(before[i].length*(1-k/24)))});await wait(27)}await wait(220);for(let k=1;k<=38;k++){if(ticket!==run)return;nodes.forEach((n,i)=>n.textContent=after[i].slice(0,Math.ceil(after[i].length*k/38)));await wait(29)}}if(ticket!==run)return;version='proposed';render();lock(false)}
Object.entries(groups).forEach(([name,g])=>{const b=document.createElement('button');b.dataset.category=name;b.setAttribute('aria-pressed',name===category);const i=document.createElement('i');i.dataset.lucide=g.icon;i.setAttribute('aria-hidden','true');b.append(i,document.createTextNode(name));b.onclick=()=>{category=name;q('.pc-list').hidden=false;render()};q('.pc-categories').append(b)});
qa('[data-version]').forEach(b=>b.onclick=()=>{version=b.dataset.version;render()});q('.pc-play').onclick=animate;q('.pc-close').onclick=()=>q('.pc-list').hidden=true;q('textarea').onfocus=()=>q('.pc-categories').hidden=false;q('textarea').oninput=sync;
function send(){const t=q('textarea').value.trim();if(!t){toast('Voice is not connected in this copy prototype.');return}q('.pc-chat').hidden=false;q('.pc-user').textContent=t;q('.pc-response').textContent='Your request is ready. This prototype demonstrates the suggestion-to-chat handoff; it does not generate live Claude responses.';q('h1').hidden=true;q('.pc-categories').hidden=true;q('.pc-list').hidden=true;q('.pc-state').textContent='';q('textarea').value='';q('textarea').placeholder='Write a message…';sync()}
q('.pc-send').onclick=send;q('textarea').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};q('.pc-new').onclick=()=>{run++;lock(false);q('.pc-chat').hidden=true;q('h1').hidden=false;q('.pc-categories').hidden=false;q('.pc-list').hidden=false;q('textarea').value='';q('textarea').placeholder='How can I help you today?';render();sync()};qa('.pc-placeholder').forEach(b=>b.onclick=()=>toast('This prototype focuses on prompt suggestions.'));render();if(globalThis.lucide)lucide.createIcons();
})();
</script>
